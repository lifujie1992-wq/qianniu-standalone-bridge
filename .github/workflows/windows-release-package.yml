name: Windows release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QN_BRAIN_SERVER_URL: http://127.0.0.1:1
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile client modules
        run: python -m py_compile standalone_bridge.py taobao_message_contract.py tmall_delivery_guard.py qianniu_app.py
      - name: Run release-critical Python tests
        run: >-
          python -m unittest
          tests.test_tmall_native_readiness
          tests.test_tmall_turn_contract
          tests.test_tmall_delivery_guard
          tests.test_tmall_failed_turn_replay
      - name: Run browser bridge contract
        run: node --test tests/browser_bridge_contract.test.js
      - name: Build Windows package
        shell: pwsh
        run: ./tools/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QianniuAIService-windows-x64
          path: delivery/windows-*/QianniuAIService-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
